<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volunteer Coordinator</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="wrap"><p class="eyebrow">Volunteer Coordinator</p><h1>Good work, organized.</h1><p>Coordinate shifts and keep track of available spaces.</p></div></header><main class="wrap"><section class="panel"><h2>Create a shift</h2><form id="shift-form"><label>Shift title<input name="title" required></label><label>Date<input name="date" type="date" required></label><label>Capacity<input name="capacity" type="number" min="1" max="100" value="3" required></label><button>Add shift</button></form></section><section class="panel"><h2>Upcoming shifts</h2><p id="summary" role="status" aria-live="polite"></p><div id="shifts" class="grid"></div></section><p class="note">Demo only. Names and shifts are stored in this browser, not shared with other coordinators.</p></main><script type="module" src="app.js"></script></body></html>
